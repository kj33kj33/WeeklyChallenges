name: .NET tests
on:
  push:
    branches: [master, 'portfolio/**']
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ChallengesWithTestsMark8.sln
      - run: dotnet build ChallengesWithTestsMark8.sln --configuration Release --no-restore
      - run: dotnet test ChallengesWithTestsMark8.sln --configuration Release --no-build --logger trx --results-directory TestResults
      - run: dotnet run --project ChallengesWithTestsMark8 --configuration Release --no-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx
